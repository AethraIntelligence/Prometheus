# A predefined process, and the whole of Phase 10's "a new workflow needs no
# change to an employee": this file names three employees that already exist,
# and nothing in `employees/` knows this file is here.
#
# It is also the shape most workflows have - gather, compute, write up - with
# the two interesting cases in it: a step that may be retried because repeating
# it costs nothing, and a step whose failure is survivable.

name: weekly-report
version: 1
description: >
  Collect what changed this week in one folder, work out the numbers, and leave
  a short report next to the data.

trigger: MANUAL

# Defaults for the placeholders below. `prometheus run-workflow weekly-report
# --input folder=sales` overrides one without editing the file.
inputs:
  folder:
    type: STRING
    default: "."
    description: Folder containing the source material.
  report:
    type: STRING
    default: weekly-report.md
    description: Output file written by the final step.

profile:
  approvals: ASK
  model: ""

budget:
  max_steps: 4
  max_cost_usd: 3
  max_wall_time_seconds: 900

steps:
  - name: survey
    employee: organizer
    instruction: >
      List everything under {folder} and say, in a few lines, what kinds of file
      are there, how many of each, and which ones changed most recently.

  - name: numbers
    employee: analyst
    depends_on: [survey]
    instruction: >
      Here is what the folder contains: {steps.survey}
      Compute the totals that these files actually support - counts, sums per
      column where there is a column - and say plainly what the data does not
      support. Do not estimate.
    # Reading files and computing over them touches nothing outside the working
    # directory, so a second attempt is free and is worth having.
    max_attempts: 2

  - name: write_up
    employee: researcher
    depends_on: [numbers]
    instruction: >
      Write {report} in the working directory: what is in {folder}, what the
      numbers say, and what they do not. Under 300 words, Markdown, no preamble.
      The survey said: {steps.survey}
      The numbers were: {steps.numbers}
    # The report is the point of the workflow, so a failure here stops the run
    # rather than leaving a run marked complete with nothing written.
    on_failure: STOP
