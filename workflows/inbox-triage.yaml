# Phase 10's validation scenario, written down: read what came in, draft the
# replies, and send nothing without being asked.
#
# The last step is the interesting one. Drafting is a write - medium risk, it
# happens. Delivering is not something this platform can undo, so it waits for a
# person however the run was started, and a run nobody is watching stops there
# with the drafts written and nothing sent. That is the intended outcome, not a
# failure of the workflow.

name: inbox-triage
version: 1
description: >
  Read everything in the inbox, decide what actually needs an answer, draft the
  answers, and stop before sending anything.

trigger: MANUAL

inputs:
  inbox:
    type: STRING
    default: inbox
    description: Folder containing messages to triage.
  drafts:
    type: STRING
    default: drafts
    description: Folder where draft replies are written.

profile:
  approvals: ASK
  model: ""

budget:
  max_steps: 3
  max_cost_usd: 3
  max_wall_time_seconds: 900

steps:
  - name: triage
    employee: organizer
    instruction: >
      List every file in {inbox} and read each one. Answer with one line per
      message, in exactly this shape and nothing else:

      <file name> | <who it is from> | <what it is about> | REPLY or IGNORE

      The file name is the first field because the next step opens these files
      by name; a summary without it is a summary nobody can act on. A newsletter
      is IGNORE. Do not write any files.

  - name: draft
    employee: researcher
    depends_on: [triage]
    instruction: >
      The triage says, one line per message, `<file name> | from | about |
      REPLY or IGNORE`:
      {steps.triage}
      Work only on the lines marked REPLY. For each of them: read
      "{inbox}/<the file name from that line>", then call fs.write once with
      path "{drafts}/<the same file name>" and the reply as the content.
      Saying a draft is written is not writing it - the file has to exist
      afterwards. Two tool calls per message and no more; do not re-read what
      you have already read. Keep each reply under 120 words, answer the actual
      question, and invent no facts. Write the files and send nothing.

  - name: deliver
    employee: analyst
    depends_on: [draft]
    instruction: >
      Send the drafts in {drafts} to their recipients by running code that
      delivers them. The drafts are: {steps.draft}
    # Sending cannot be undone, so this waits for a person. Under an unattended
    # run there is nobody to ask, and the honest outcome is that the run stops
    # here with the drafts written and nothing delivered.
    on_failure: STOP
