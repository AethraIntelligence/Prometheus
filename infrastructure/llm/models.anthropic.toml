# A catalog that talks to Anthropic directly, rather than through a router.
#
#   PROMETHEUS_MODEL_CATALOG_PATH=infrastructure/llm/models.anthropic.toml
#   PROMETHEUS_LLM_API_KEY=sk-ant-...
#
# The bundled `models.toml` reaches the same models through OpenRouter, which is
# one key for many vendors. This one is for an Anthropic key, and is the reason
# `infrastructure/llm/anthropic.py` exists.
#
# Costs are per 1000 tokens in USD and price every call, so `prometheus spend` is only
# as honest as they are.

[models.balanced]
provider = "anthropic"
model = "claude-sonnet-5"
capabilities = ["TEXT_REASONING", "TOOL_CALLING", "STRUCTURED_OUTPUT", "LONG_CONTEXT", "VISION", "CODE"]
context_tokens = 1000000
input_cost_per_1k_usd = 0.002
output_cost_per_1k_usd = 0.010
quality = 0.9

[models.fast]
provider = "anthropic"
model = "claude-haiku-4-5"
capabilities = ["TEXT_REASONING", "TOOL_CALLING", "STRUCTURED_OUTPUT", "LONG_CONTEXT", "VISION", "CODE"]
context_tokens = 200000
input_cost_per_1k_usd = 0.001
output_cost_per_1k_usd = 0.005
quality = 0.6

[models.deep]
provider = "anthropic"
model = "claude-opus-5"
capabilities = ["TEXT_REASONING", "TOOL_CALLING", "STRUCTURED_OUTPUT", "LONG_CONTEXT", "VISION", "CODE"]
context_tokens = 1000000
input_cost_per_1k_usd = 0.005
output_cost_per_1k_usd = 0.025
quality = 1.0

[defaults]
planning = "balanced"
execution = "balanced"
verification = "fast"
synthesis = "balanced"
extraction = "fast"
decision = "fast"
conversation = "balanced"
