# --- Providers ------------------------------------------------------------------

[[providers]]
kind = "openrouter"
label = "OpenRouter"
verdict = "RECOMMENDED"
text = "One key for hundreds of models from every major lab, including free ones. The easiest start and the most choice."

[[providers]]
kind = "anthropic"
label = "Anthropic"
verdict = "SUPPORTED"
text = "Claude models directly. Best if you already have an Anthropic key; reaches Claude models only."

[[providers]]
kind = "local"
label = "Local model runner (Ollama)"
verdict = "SUPPORTED"
text = "Free and private. Quality depends on your computer; weaker at long tasks than hosted models."

[[providers]]
kind = "openai"
label = "OpenAI"
verdict = "NOT_YET"
text = "Not connected directly yet. Use OpenAI models through OpenRouter with the same results."

[[providers]]
kind = "gemini"
label = "Google Gemini"
verdict = "NOT_YET"
text = "Not connected directly yet. Use Gemini models through OpenRouter with the same results."

[[providers]]
kind = "typesafe"
label = "TypeSafe (decisions)"
verdict = "SUPPORTED"
text = "A model built to decide rather than to write, for the decision kind of work only. Fast, cheap and calibrated; if it cannot answer, decisions go to your text model. Best in English."

# --- What a model has to be able to do -------------------------------------------

[[requirements]]
title = "Tool calling - required"
text = "Employees act by calling tools: reading files, opening pages, running code. A model without tool support can talk but cannot do anything."

[[requirements]]
title = "Structured output - required"
text = "Plans, checks and decisions come back as structured data. Models that cannot keep to a format make plans fail."

[[requirements]]
title = "Quality 0.5 or higher for checking and delegating"
text = "Judging whether work was done, and choosing who does it, are refused to weaker models. Keep at least one model at 0.5 or above."

[[requirements]]
title = "Vision - only for the browser screen and the desktop"
text = "Needed to see screenshots. Everything else works without it."

[[requirements]]
title = "Embeddings - for searching documents by meaning"
text = "A separate, small model. Best kept local, since it reads your documents. Without one, documents are searched by words."
