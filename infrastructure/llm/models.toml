# The model catalog. Editing this file is how you change models.
#
# `capabilities` uses the vocabulary in `domain/capabilities/models.py`.
# Costs are per 1000 tokens in USD and are used to price every call, so keep
# them current: a wrong number here shows up as a wrong bill in `prometheus spend`.

[models.balanced]
provider = "openrouter"
model = "anthropic/claude-sonnet-5"
capabilities = ["TEXT_REASONING", "TOOL_CALLING", "STRUCTURED_OUTPUT", "LONG_CONTEXT", "VISION", "CODE"]
context_tokens = 200000
input_cost_per_1k_usd = 0.003
output_cost_per_1k_usd = 0.015
quality = 0.9

[models.fast]
provider = "openrouter"
model = "anthropic/claude-haiku-4.5"
capabilities = ["TEXT_REASONING", "TOOL_CALLING", "STRUCTURED_OUTPUT", "LONG_CONTEXT"]
context_tokens = 200000
input_cost_per_1k_usd = 0.001
output_cost_per_1k_usd = 0.005
quality = 0.6

[models.deep]
provider = "openrouter"
model = "anthropic/claude-opus-5"
capabilities = ["TEXT_REASONING", "TOOL_CALLING", "STRUCTURED_OUTPUT", "LONG_CONTEXT", "VISION", "CODE"]
context_tokens = 200000
input_cost_per_1k_usd = 0.015
output_cost_per_1k_usd = 0.075
quality = 1.0

# Turning text into a vector, for retrieval over the user's own documents.
#
# Local by default even in the hosted catalog, and that is deliberate: what is
# embedded here is the contents of documents somebody put on this machine, one
# call per passage, and there is no reason to send them anywhere. It also costs
# nothing and needs no key, so `prometheus documents` works on a machine that has
# never configured a provider.
#
# Needs `ollama pull nomic-embed-text`. Without it, retrieval falls back to the
# text index alone and says so in the log rather than failing the run.
[models.embedding]
provider = "local"
model = "nomic-embed-text"
capabilities = ["EMBEDDING"]
context_tokens = 8192
input_cost_per_1k_usd = 0.0
output_cost_per_1k_usd = 0.0
quality = 0.5
dimensions = 768

# A model built to decide rather than to write: it takes a question and a set of
# options and answers with one of them and how likely each was. It never writes
# text, so an entry offering only DECISION is kept out of every other kind of
# work, and routing `decision` to it is the whole of switching it on. If it
# cannot answer - no key, a rate limit, an outage - the question goes to the text
# model and the log says why. Add the connection (kind "typesafe") in Settings,
# then uncomment. `jev-latest` moves with each release; pin a versioned id such
# as `jev-1.13.0` once thresholds are tuned against it. Input tokens only are
# charged ($42 per billion); context is 64k, of which 32k for the state.
#
# [models.jev]
# provider = "typesafe"
# model = "jev-latest"
# connection = "typesafe"
# capabilities = ["DECISION"]
# context_tokens = 32000
# input_cost_per_1k_usd = 0.000042
# output_cost_per_1k_usd = 0.0
# quality = 0.6
# privacy = "REMOTE"

# Which entry each kind of work reaches for first.
[defaults]
planning = "balanced"
execution = "balanced"
verification = "fast"
synthesis = "balanced"
extraction = "fast"
decision = "fast"
conversation = "balanced"
embedding = "embedding"
