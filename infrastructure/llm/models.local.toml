# A catalog of locally served models. Point PROMETHEUS_MODEL_CATALOG_PATH at this file
# to run the whole platform without a provider key and without spending anything:
#
#   PROMETHEUS_MODEL_CATALOG_PATH=infrastructure/llm/models.local.toml uv run prometheus ask "..."
#
# It expects a local server on http://127.0.0.1:11434/v1 (Ollama's default) with
# these models pulled. Costs are zero because they are: the price of a local call
# is electricity, not billing.

# Ollama serves some models by running them on its own machines rather than on
# this one. They are reached through the same local endpoint and need no
# provider key here, so they belong in this catalog - but the entry says so,
# because "local" in the file name stops being literally true for this one.
# Available only if `ollama pull gemma4:31b-cloud` has been run and the account
# behind it can reach the cloud tier.
[models.local-strong]
provider = "local"
model = "gemma4:31b-cloud"
# Served through the local endpoint, answered on the vendor's machines: its
# prompts leave this one, so the contract says so and `local_models_only`
# will not route here.
privacy = "REMOTE"
capabilities = ["TEXT_REASONING", "TOOL_CALLING", "STRUCTURED_OUTPUT", "LONG_CONTEXT", "CODE"]
context_tokens = 131072
input_cost_per_1k_usd = 0.0
output_cost_per_1k_usd = 0.0
quality = 0.8

[models.local-balanced]
provider = "local"
model = "lfm2:24b"
capabilities = ["TEXT_REASONING", "TOOL_CALLING", "STRUCTURED_OUTPUT", "LONG_CONTEXT", "CODE"]
context_tokens = 131072
input_cost_per_1k_usd = 0.0
output_cost_per_1k_usd = 0.0
quality = 0.6

[models.local-fast]
provider = "local"
model = "lfm2.5:8b"
capabilities = ["TEXT_REASONING", "TOOL_CALLING", "STRUCTURED_OUTPUT", "LONG_CONTEXT"]
context_tokens = 32768
input_cost_per_1k_usd = 0.0
output_cost_per_1k_usd = 0.0
quality = 0.4

# Reading a screen is the one thing in the platform that needs eyes. The router
# is asked for VISION and answers from here; without an entry that offers it,
# every computer-use run fails at routing with a message about this file, which
# is the right place for that to be fixed.
[models.local-vision]
provider = "local"
model = "qwen2.5vl:7b"
capabilities = ["TEXT_REASONING", "VISION", "STRUCTURED_OUTPUT"]
context_tokens = 32768
input_cost_per_1k_usd = 0.0
output_cost_per_1k_usd = 0.0
quality = 0.6

# The stronger entry takes the work that decides things - planning, acting,
# writing the answer - and the small ones keep the cheap, structured jobs.
# Anything here still runs without a provider key.
#
# `verification` is left pointing here at the small entry on purpose, and is
# not honoured: verification declares a quality floor as a *requirement*
# (`domain.employees.verification.MIN_JUDGEMENT_QUALITY`), so this entry is
# filtered out before the default is consulted and the trace says why - "default
# 'local-fast' cannot do this work". That is the first validation run's third
# finding made visible rather than papered over by editing one line here, which
# the next catalog would undo.
# Turning text into a vector, for retrieval over the user's own documents.
#
# Local by default even in the hosted catalog, and that is deliberate: what is
# embedded here is the contents of documents somebody put on this machine, one
# call per passage, and there is no reason to send them anywhere. It also costs
# nothing and needs no key, so `prometheus documents` works on a machine that has
# never configured a provider.
#
# Needs `ollama pull nomic-embed-text`. Without it, retrieval falls back to the
# text index alone and says so in the log rather than failing the run.
[models.embedding]
provider = "local"
model = "nomic-embed-text"
capabilities = ["EMBEDDING"]
context_tokens = 8192
input_cost_per_1k_usd = 0.0
output_cost_per_1k_usd = 0.0
quality = 0.5
dimensions = 768

[defaults]
planning = "local-strong"
execution = "local-strong"
verification = "local-fast"
synthesis = "local-strong"
extraction = "local-fast"
decision = "local-fast"
conversation = "local-strong"
embedding = "embedding"
