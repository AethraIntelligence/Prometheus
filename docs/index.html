  <style>
    /* The desktop window's design, applied to its documentation: the same tokens as
       desktop/src/app/styles/global.css, the same hairlines, radii and pills, and the
       dark palette as the same tokens turned over. */
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

    :root {
      --bg:#ffffff; --ink:#111113; --on-ink:#ffffff; --text:#1d1d1f;
      --grey:#6e6e73; --grey-2:#8e8e93; --panel:#f5f5f7; --panel-2:#fafafa;
      --hair:#e7e7ea; --hair-2:#d6d6da; --hover:rgba(0,0,0,.05); --selected:#efeff1; --field:#ffffff;
      --add:#137333; --add-bg:#f0f8f2; --add-line:#cde6d4;
      --del:#b42318; --del-bg:#fef3f2; --del-line:#f7d4cf;
      --wait:#a55a00; --wait-bg:#fdf6ec; --wait-line:#f0dcc0; --wait-text:#7a4a08;
      --placeholder:#aeaeb2;
      --font:"Onest",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
      --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
      --sidebar-w:272px; --toc-w:220px; --nav-h:52px;
      color-scheme:light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#161618; --ink:#f2f2f4; --on-ink:#111113; --text:#ededf0;
        --grey:#a1a1a8; --grey-2:#7c7c84; --panel:#232326; --panel-2:#1c1c1f;
        --hair:#2c2c30; --hair-2:#3a3a3f; --hover:rgba(255,255,255,.06); --selected:#2a2a2e; --field:#1c1c1f;
        --add:#5bbf7a; --add-bg:#15241a; --add-line:#244a30;
        --del:#f07a6a; --del-bg:#2a1716; --del-line:#4a2421;
        --wait:#e0a04a; --wait-bg:#2a2115; --wait-line:#4a3920; --wait-text:#e8c089;
        --placeholder:#6a6a70;
      }
    }

    html { scroll-behavior:smooth; }
    body { font-family:var(--font); font-size:15px; background:var(--bg); color:var(--text); line-height:1.5;
      letter-spacing:-.016em; -webkit-font-smoothing:antialiased; }
    button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; letter-spacing:inherit; }
    a { color:inherit; text-decoration:none; }
    :focus-visible { outline:2px solid var(--ink); outline-offset:2px; border-radius:8px; }

    ::-webkit-scrollbar { width:8px; height:8px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--hair-2); border-radius:980px; border:2px solid var(--bg); }

    /* ── the header ─────────────────────────── */
    .topnav { position:fixed; top:0; left:0; right:0; z-index:100; height:var(--nav-h);
      background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:saturate(180%) blur(18px);
      border-bottom:1px solid var(--hair); display:flex; align-items:center; padding:0 16px; gap:10px; }
    .topnav-logo { display:flex; align-items:center; gap:9px; font-weight:600; font-size:17px; letter-spacing:-.03em;
      color:var(--text); flex-shrink:0; cursor:pointer; padding-left:2px; }
    .topnav-logo img { width:26px; height:26px; border-radius:8px; flex:none; }
    .topnav-logo .by { color:var(--grey-2); font-weight:400; margin-left:-3px; }
    .nav-divider { width:1px; height:18px; background:var(--hair); flex-shrink:0; }
    .nav-badge { display:inline-flex; align-items:center; padding:4px 9px; border-radius:8px; background:var(--panel);
      font-size:12px; color:var(--grey); flex-shrink:0; }
    .nav-search { flex:1; max-width:300px; margin-left:auto; display:flex; align-items:center; gap:8px;
      background:var(--field); border:1px solid var(--hair); border-radius:10px; padding:0 10px; height:34px;
      color:var(--grey-2); font-size:14px; transition:border-color .16s; }
    .nav-search:focus-within { border-color:var(--hair-2); color:var(--text); }
    .nav-search input { border:none; background:transparent; outline:none; font:inherit; font-size:14px; color:var(--text); flex:1; min-width:0; }
    .nav-search input::placeholder { color:var(--grey-2); }
    .nav-version { display:inline-flex; align-items:center; padding:4px 9px; border-radius:8px; background:var(--panel);
      font-family:var(--mono); font-size:12px; letter-spacing:0; color:var(--grey); flex-shrink:0; }
    .nav-gh { display:inline-flex; align-items:center; gap:6px; padding:6px 13px; border-radius:980px;
      border:1px solid var(--hair-2); background:var(--bg); font-size:13px; font-weight:500; color:var(--text);
      white-space:nowrap; flex-shrink:0; transition:background .16s; }
    .nav-gh:hover { background:var(--panel); }

    .mob-menu-btn { display:none; width:32px; height:32px; border-radius:9px; margin-left:auto;
      flex-direction:column; align-items:center; justify-content:center; gap:4px; flex-shrink:0; transition:background .16s; }
    .mob-menu-btn:hover { background:var(--hover); }
    .mob-menu-btn span { display:block; width:16px; height:1.5px; border-radius:2px; background:var(--grey); transition:.2s; }
    .mob-menu-btn.open span:nth-child(1) { transform:translateY(5.5px) rotate(45deg); }
    .mob-menu-btn.open span:nth-child(2) { opacity:0; }
    .mob-menu-btn.open span:nth-child(3) { transform:translateY(-5.5px) rotate(-45deg); }

    .layout { display:flex; padding-top:var(--nav-h); }

    /* ── the sidebar: the window's list of threads ── */
    .sidebar { position:fixed; top:var(--nav-h); left:0; width:var(--sidebar-w); height:calc(100vh - var(--nav-h));
      overflow-y:auto; background:var(--panel-2); border-right:1px solid var(--hair); padding:6px 8px 40px; }
    .sidebar-group-label { font-size:13px; font-weight:500; color:var(--grey-2); padding:16px 10px 6px; }
    .sidebar-group-label:first-child { padding-top:10px; }
    .sidebar-link { display:flex; align-items:center; gap:10px; width:100%; padding:7px 10px; border-radius:10px;
      font-size:14.5px; color:var(--text); text-align:left; cursor:pointer; user-select:none; transition:background .14s; }
    .sidebar-link:hover { background:var(--hover); }
    .sidebar-link.active { background:var(--selected); font-weight:500; }
    .sidebar-num { font-family:var(--mono); font-size:11.5px; letter-spacing:0; color:var(--grey-2); flex-shrink:0; min-width:18px; }
    .sidebar-link.active .sidebar-num { color:var(--text); }
    .sidebar-hr { display:none; }

    .sidebar-overlay { display:none; position:fixed; inset:0; z-index:89; background:rgba(0,0,0,.28); }
    .sidebar-overlay.visible { display:block; }

    /* One narrow column, as the conversation is: a grid track so every child shares
       one left edge whatever its own margins say. Grid items do not collapse margins,
       so the vertical rhythm below is set with that in mind. */
    .content-area { margin-left:var(--sidebar-w); margin-right:var(--toc-w); flex:1; min-width:0; padding:40px 28px 120px;
      display:grid; grid-template-columns:minmax(0,720px); justify-content:center; align-content:start; }

    /* ── on this page ───────────────────────── */
    .toc { position:fixed; top:var(--nav-h); right:0; width:var(--toc-w); height:calc(100vh - var(--nav-h));
      padding:40px 20px 48px 8px; overflow-y:auto; }
    .toc-title { font-size:13px; font-weight:500; color:var(--grey-2); margin:0 0 8px 12px; }
    .toc-link { display:block; font-size:13px; color:var(--grey); padding:4px 10px; margin-bottom:1px; border-radius:8px;
      line-height:1.45; cursor:pointer; transition:background .14s,color .14s; }
    .toc-link:hover { background:var(--hover); color:var(--text); }
    .toc-link.active { background:var(--selected); color:var(--text); font-weight:500; }

    @media (max-width:1100px) { .toc { display:none; } .content-area { margin-right:0; } }
    @media (max-width:768px) {
      .topnav { gap:8px; }
      .nav-version, .nav-search, .nav-divider, .nav-badge, .nav-gh { display:none; }
      .mob-menu-btn { display:flex; }
      .sidebar { transform:translateX(-100%); transition:transform .25s ease; z-index:90; box-shadow:0 12px 40px rgba(0,0,0,.18); }
      .sidebar.mobile-open { transform:translateX(0); }
      .content-area { margin-left:0; padding:24px 16px 80px; }
      .api-table-wrap { overflow-x:auto; }
      .page-nav { flex-direction:column; }
      .page-nav-btn.next { text-align:left; }
    }

    /* ── a page: the greeting's type, the answer's rhythm ── */
    .page-label { font-size:13px; font-weight:500; color:var(--grey-2); margin-bottom:8px; }
    .page-title { font-size:30px; font-weight:600; line-height:1.18; letter-spacing:-.03em; color:var(--text); margin-bottom:8px; }
    .page-desc { font-size:16px; color:var(--grey); line-height:1.55; margin-bottom:26px; max-width:64ch; }
    .page-divider { border:none; border-top:1px solid var(--hair); margin:26px 0; }

    h2.section-title { font-size:20px; font-weight:600; letter-spacing:-.025em; color:var(--text); margin:32px 0 12px;
      scroll-margin-top:calc(var(--nav-h) + 20px); }
    h2.section-title:first-of-type { margin-top:0; }
    h3.subsection-title { font-size:16px; font-weight:600; letter-spacing:-.015em; margin:24px 0 8px; }

    .prose p { margin-bottom:13px; font-size:15px; line-height:1.62; color:var(--text); }
    .prose ul, .prose ol { margin:0 0 13px; padding-left:1.5em; font-size:15px; line-height:1.62; }
    .prose li { margin-bottom:6px; padding-left:2px; }
    .prose ol > li::marker { font-weight:600; }
    .prose a { cursor:pointer; text-decoration:underline; text-decoration-color:var(--hair-2); text-underline-offset:3px; transition:text-decoration-color .16s; }
    .prose a:hover { text-decoration-color:var(--text); }
    .prose strong { font-weight:600; }
    code { font-family:var(--mono); font-size:12.5px; letter-spacing:0; background:var(--panel); color:var(--text); padding:1px 5px; border-radius:5px; }

    /* "Why this exists": a result card */
    .why-box { border:1px solid var(--hair); border-radius:14px; overflow:hidden; margin:6px 0 20px; background:var(--bg); }
    .why-box .why-label { padding:9px 13px; background:var(--panel-2); border-bottom:1px solid var(--hair);
      font-size:12.5px; font-weight:500; color:var(--grey); }
    .why-box p { margin:0; padding:12px 13px; font-size:14px; line-height:1.58; color:var(--text); }

    /* code: the file row's card with a pre inside */
    .code-block { border:1px solid var(--hair); border-radius:14px; overflow:hidden; margin:14px 0 18px; background:var(--panel-2); }
    .code-block-header { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 6px 6px 13px;
      background:var(--bg); border-bottom:1px solid var(--hair); }
    .code-block-lang, .code-block-filename { font-family:var(--mono); font-size:12px; letter-spacing:0; color:var(--grey); }
    .code-copy-btn { display:inline-flex; align-items:center; padding:4px 11px; border-radius:8px; font-size:12.5px;
      color:var(--grey); transition:background .16s,color .16s; }
    .code-copy-btn:hover { background:var(--hover); color:var(--text); }
    .code-copy-btn.copied { color:var(--add); }
    .code-block pre { padding:12px 14px; overflow-x:auto; font-family:var(--mono); font-size:12.5px; letter-spacing:0;
      line-height:1.65; color:var(--text); white-space:pre; }
    .code-block pre.diagram { font-family:ui-monospace,'Cascadia Mono','Consolas','SFMono-Regular','Menlo','DejaVu Sans Mono',monospace; line-height:1.45; }

    /* callouts: info is a quiet panel, warning is the approval gate, tip is its green twin */
    .callout { display:flex; gap:10px; padding:12px 14px; border-radius:14px; margin:14px 0 18px; font-size:14px; line-height:1.55;
      border:1px solid var(--hair); background:var(--panel-2); color:var(--text); }
    .callout-icon { width:20px; height:20px; border-radius:6px; display:grid; place-items:center; flex:none; font-size:12px;
      margin-top:1px; background:var(--bg); border:1px solid var(--hair); color:var(--grey); }
    .callout p { margin:0; }
    .callout.warning { background:var(--wait-bg); border-color:var(--wait-line); color:var(--wait-text); }
    .callout.warning .callout-icon { color:var(--wait); border-color:var(--wait-line); }
    .callout.tip { background:var(--add-bg); border-color:var(--add-line); }
    .callout.tip .callout-icon { color:var(--add); border-color:var(--add-line); }
    .callout code { background:color-mix(in srgb, var(--bg) 65%, transparent); }

    .steps { display:flex; flex-direction:column; margin:18px 0 22px; position:relative; }
    .steps::before { content:''; position:absolute; left:13px; top:28px; bottom:28px; width:1px; background:var(--hair); }
    .step { display:flex; gap:14px; padding-bottom:20px; position:relative; }
    .step:last-child { padding-bottom:0; }
    .step-num { width:27px; height:27px; border-radius:50%; background:var(--ink); color:var(--on-ink); font-size:12.5px; font-weight:600;
      display:grid; place-items:center; flex-shrink:0; z-index:1; letter-spacing:0; }
    .step-body { flex:1; min-width:0; padding-top:3px; }
    .step-title { font-size:15px; font-weight:500; letter-spacing:-.014em; margin-bottom:3px; }
    .step-desc { font-size:14px; color:var(--grey); line-height:1.55; }
    .step-desc code { color:var(--text); }

    /* tables: one bordered card, rows divided by hairlines */
    .api-table { width:100%; border-collapse:separate; border-spacing:0; margin:12px 0 20px; font-size:14px;
      border:1px solid var(--hair); border-radius:14px; overflow:hidden; }
    .api-table thead th { text-align:left; padding:9px 13px; font-size:12.5px; font-weight:500; color:var(--grey);
      background:var(--panel-2); border-bottom:1px solid var(--hair); white-space:nowrap; }
    .api-table tbody td { padding:10px 13px; border-top:1px solid var(--hair); color:var(--text); vertical-align:top; line-height:1.5; }
    .api-table tbody tr:first-child td { border-top:0; }
    .api-table tbody tr:hover td { background:var(--panel-2); }
    .api-table td code { font-size:12px; white-space:nowrap; }
    .api-table-wrap { margin:12px 0 20px; }
    .api-table-wrap .api-table { margin:0; }

    .badge { display:inline-flex; align-items:center; padding:1px 8px; border-radius:980px; font-family:var(--mono); font-size:11px;
      font-weight:500; letter-spacing:0; line-height:1.6; white-space:nowrap; border:1px solid transparent; }
    .badge.get { background:var(--panel); color:var(--grey); }
    .badge.post { background:var(--add-bg); color:var(--add); border-color:var(--add-line); }
    .badge.put { background:var(--wait-bg); color:var(--wait); border-color:var(--wait-line); }
    .badge.del { background:var(--del-bg); color:var(--del); border-color:var(--del-line); }

    /* quick check: a card with bordered choices */
    .quiz { border:1px solid var(--hair); border-radius:14px; padding:14px; margin:14px 0 20px; background:var(--bg); }
    .quiz-q { font-size:15px; font-weight:500; letter-spacing:-.014em; margin-bottom:12px; }
    .quiz-opt { display:block; width:100%; text-align:left; padding:9px 13px; margin-bottom:7px; border:1px solid var(--hair);
      border-radius:10px; background:var(--bg); font-size:14px; color:var(--text); transition:background .16s,border-color .16s,color .16s; }
    .quiz-opt:hover { background:var(--panel); border-color:var(--hair-2); }
    .quiz-opt.correct { border-color:var(--add-line); background:var(--add-bg); color:var(--add); }
    .quiz-opt.wrong { border-color:var(--del-line); background:var(--del-bg); color:var(--del); }
    .quiz-explain { margin-top:6px; padding:10px 13px; background:var(--panel-2); border:1px solid var(--hair); border-radius:10px;
      font-size:13.5px; color:var(--grey); line-height:1.55; display:none; }
    .quiz-explain.show { display:block; }
    .quiz-explain code { color:var(--text); }

    .page-nav { display:flex; gap:10px; margin-top:52px; }
    .page-nav-btn { flex:1; display:flex; flex-direction:column; gap:2px; padding:12px 14px; border:1px solid var(--hair);
      border-radius:14px; background:var(--bg); cursor:pointer; transition:background .16s,border-color .16s; }
    .page-nav-btn:hover { background:var(--panel-2); border-color:var(--hair-2); }
    .page-nav-btn.next { text-align:right; }
    .page-nav-label { font-size:12px; color:var(--grey-2); }
    .page-nav-title { font-size:14.5px; font-weight:500; color:var(--text); }

    .coming-soon { padding:60px 20px; text-align:center; color:var(--grey-2); }
    .coming-soon-icon { font-size:36px; margin-bottom:14px; }
    .coming-soon-title { font-size:17px; font-weight:600; color:var(--text); margin-bottom:6px; }

    .hero-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:18px 0 22px; }
    @media (max-width:640px) { .hero-grid { grid-template-columns:1fr; } }
    .hero-card { border:1px solid var(--hair); border-radius:14px; padding:13px 14px; background:var(--bg); transition:background .16s; }
    .hero-card:hover { background:var(--panel-2); }
    .hero-card-icon { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; background:var(--panel);
      font-size:15px; margin-bottom:10px; }
    .hero-card-title { font-size:14.5px; font-weight:500; letter-spacing:-.014em; margin-bottom:2px; }
    .hero-card-desc { font-size:13.5px; color:var(--grey); line-height:1.5; }
  </style>
</head>

  <script>
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  // Box-drawing, arrows, block and geometric glyphs fall outside the served
  // JetBrains Mono subset, so they render in a fallback font whose advance width
  // differs from JetBrains' — which shears any character-aligned diagram. Detect
  // them and render that block in a single full-coverage system monospace so every
  // glyph shares one metric and the grid stays aligned.
  const DIAGRAM_GLYPHS = /[←-⇿─-╿▀-▟■-◿]/;
  function code(lang, filename, body){
    const head = filename
      ? '<span class="code-block-filename">'+filename+'</span>'
      : '<span class="code-block-lang">'+lang+'</span>';
    const preClass = DIAGRAM_GLYPHS.test(body) ? ' class="diagram"' : '';
    return '<div class="code-block"><div class="code-block-header">'+head
      + '<button class="code-copy-btn" onclick="copyCode(this)">Copy</button></div>'
      + '<pre'+preClass+'>'+esc(body)+'</pre></div>';
  }
  function callout(type, html){
    const icons = { info:"\u2139", warning:"\u26A0", tip:"\u2726" };
    return '<div class="callout '+type+'"><span class="callout-icon">'+icons[type]+'</span><div>'+html+'</div></div>';
  }
  function why(html){ return '<div class="why-box"><div class="why-label">Why this exists</div><p>'+html+'</p></div>'; }
  function quiz(q, opts, correct, explain){
    const id = 'q' + Math.random().toString(36).slice(2,8);
    // pair each option with a flag for whether it's the correct one
    const paired = opts.map(function(o,i){ return { text:o, isCorrect:i===correct }; });
    // Fisher-Yates shuffle so the correct answer isn't always in the same spot
    for(let i=paired.length-1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      const tmp = paired[i]; paired[i] = paired[j]; paired[j] = tmp;
    }
    const newCorrect = paired.findIndex(function(p){ return p.isCorrect; });

  <div class="page-label">03 · Core concepts</div>
  <h1 class="page-title">Prometheus, the manager</h1>
  <p class="page-desc">The manager reads, plans, delegates, supervises and checks. It never runs a task itself and never resolves an approval.</p>
  <hr class="page-divider" />

  <h2 class="section-title" id="what">What the manager does</h2>
  <div class="prose"><p>The manager lives in ${src("application/prometheus/")} and imports <code>domain/</code> and nothing else. Three contracts carry it: <code>EmployeeRegistry</code> (the only way it learns who exists), <code>TaskExecution</code> (the only way work happens) and the objective/plan repositories.</p></div>
  ${why("A manager that could run tasks itself would quietly become a sixth employee with no declaration, no limits and no least privilege. Keeping it to decisions keeps every action on the one audited path.")}

  <h2 class="section-title" id="order">The order of work</h2>
  ${steps([
    ["Read the request","Recall memory and retrieve documents once per objective, then produce an intent: a restatement, constraints, preferences and acceptance criteria."],
    ["Answer it (sometimes)","A request needing no work gets an answer, not a plan. The answer still faces the verifier."],
    ["Plan it","A plan is a set of tasks with declared dependency edges, and what each task needs."],
    ["Delegate and supervise","Each task goes to an employee chosen from those who can do it. Independent tasks run at once."],
    ["Check it","A verifier compares the work — and the record of what ran — to the criteria."],
    ["Replan once (sometimes)","A rejected verdict sends the work back, told what was missing. A second rejection is escalated with what did succeed."],
    ["Write one answer","Contradictions are reconciled, then one reply is written in your configured language."]
  ])}

  <h2 class="section-title" id="criteria">Criteria come first</h2>
  <div class="prose"><p>Acceptance criteria are written out of reading the request and stored on the objective <strong>before</strong> any work begins, so the standard cannot be invented after seeing the result. When the reading produced none, the request itself is the standard.</p></div>
  ${callout("warning","A direct answer faces the same verifier as delegated work. \"Read the notes and leave me a summary file\" once read as needing no work, closed with one sentence and no file. Now a claim of \"needs no work\" that its answer cannot satisfy becomes work.")}

  <h2 class="section-title" id="talk">Talk is the one exception</h2>
  <div class="prose"><p>A direct answer with <em>no</em> criteria — "Hello" — is not verified, because judging a greeting against "nothing was done" rejects every greeting. Instead, "no work" is believed only when a one-letter triage prompt (<code>prometheus_triage</code>) agrees.</p></div>

  <h2 class="section-title" id="routing">Routing by what work needs</h2>
  <div class="prose"><p>Every planned task lists its <code>needs</code>, on two axes:</p><ul>
    <li>a <strong>capability</strong> — <code>FILE_ACCESS</code>, <code>WEB_BROWSING</code>, <code>CODE</code>, <code>COMPUTER_USE</code>, <code>EMAIL</code>…</li>
    <li>the <strong>name of a connected service</strong> — for work only one integration can do.</li>
  </ul><p>The delegator narrows the candidates on both before any model sees them; if one candidate remains, choosing costs nothing. A requirement nobody declares is dropped rather than obeyed — a task routed imperfectly beats one routed nowhere. Delegation itself has a quality floor, so the cheapest model never decides who does the work.</p></div>

  <h2 class="section-title" id="recovery">Recovery by kind of failure</h2>
  <table class="api-table"><thead><tr><th>Failure</th><th>Response</th></tr></thead><tbody>
    <tr><td>Transient error</td><td>Retried with the same employee, as a new task hanging off the failed one.</td></tr>

    <tr><td>Spent budget</td><td>Replanned.</td></tr>
    <tr><td>Cancellation</td><td>Left alone. A cancelled run is never verified.</td></tr>
  </tbody></table>
  <div class="prose"><p>Failures are classified by exception <strong>type</strong> and flags written by the executor — never by matching message text.</p></div>

  <h2 class="section-title" id="narrow">Delegation only narrows</h2>

  - fs.write_pdf

capabilities:           # can it?  what the manager routes by
  - WEB_BROWSING
  - FILE_ACCESS

policies:               # can only narrow what the threshold allows
  - no_irreversible_actions

model_profile:          # what the work needs - never a model name
  capabilities: [TEXT_REASONING, LONG_CONTEXT, TOOL_CALLING]
  min_context_tokens: 16000
  temperature: 0.2

memory_scope: EMPLOYEE_PRIVATE

limits:
  max_steps: 12
  max_cost_usd: 0.50
  max_wall_time_seconds: 600`)}
  <div class="prose"><p>An employee may also declare <code>integrations: [gmail]</code> — a grant to a whole connected service. See <a onclick="go('integrations')">Plugins &amp; MCP</a>.</p></div>

  <h2 class="section-title" id="lists">Two lists, two questions</h2>
  <table class="api-table"><thead><tr><th>Field</th><th>Question</th><th>If wrong</th></tr></thead><tbody>
    <tr><td><code>allowed_tools</code></td><td><em>May</em> it? Least privilege.</td><td>A tool not listed is a tool that cannot be called.</td></tr>
    <tr><td><code>capabilities</code></td><td><em>Can</em> it? Discovery.</td><td>Left out: work never arrives. Claimed with no tool behind it: work arrives and cannot start.</td></tr>
  </tbody></table>
  ${why("A single list would silently answer one of these two questions wrong. What an employee is trusted with and what work it should be offered are different facts.")}

  <h2 class="section-title" id="validation">Checked at load</h2>
  <div class="prose"><p>The registry is strict about shape — an unknown field, a temperature outside 0–2, a zero budget, a goal with no text — and names the file. Then the declaration is checked against the tools that exist on this machine. The line between an <strong>error</strong> and a <strong>warning</strong> is who can fix it: a capability nothing backs is wrong everywhere; a tool switched off here may just be a different configuration.</p></div>
  ${code("bash","",`uv run prometheus employees            # all of it, errors and warnings
uv run prometheus employees --strict   # exit non-zero on any problem`)}

  <h2 class="section-title" id="runtime">One runtime for all</h2>
  <div class="prose"><p>Every employee runs through ${src("application/employee_runtime/runtime.py")}: <strong>plan → execute → verify</strong>, where a rejected verdict sends the work back through planning once. Execution is a tool-calling loop bounded at once by steps, cost and wall time, each action followed by an explicit observation. State is persisted after every stage and every step, which is what makes <code>prometheus resume</code> work after <code>kill -9</code>.</p></div>
  ${callout("warning","A second employee runtime, or an employee-specific class, is a design error. If an employee needs different behaviour, it needs a different declaration.")}

role: Translator
goals:

allowed_tools: [fs.read, fs.write]
capabilities: [FILE_ACCESS]
model_profile:
  capabilities: [TEXT_REASONING, LONG_CONTEXT]
limits: { max_steps: 8, max_cost_usd: 0.50 }`)}

`;

  <div class="page-label">05 · Core concepts</div>
  <h1 class="page-title">Tools &amp; interfaces</h1>

  <h2 class="section-title" id="effect">Effect and risk</h2>
  <div class="prose"><p>Every tool declares what it does to the world: <code>READ</code>, <code>WRITE</code>, <code>EXECUTE</code>, <code>DELETE</code>, <code>SEND</code>, <code>PUBLISH</code> or <code>SPEND</code>. The risk level follows from the effect. A spec can raise the level its effect implies, never lower it. Details in <a onclick="go('approvals')">Approvals &amp; policies</a>.</p></div>

  <div class="prose"><p>Argument handling is forgiving where a model is clumsy and strict where it is wrong:</p><ul>
    <li>types are coerced;</li>
    <li>unknown arguments are dropped and reported back as <code>ignored_arguments</code>;</li>
    <li>a missing required argument comes back with the call's expected shape.</li>
  </ul><p>All three came out of watching a 20B local model burn its step budget on rejected calls.</p></div>
  ${callout("info","Tool names are dotted (<code>browser.extract</code>) but function-calling formats allow only <code>a-z A-Z 0-9 _ -</code>. Names are translated on the way out and back for every provider adapter.")}

  <h2 class="section-title" id="refused">Refused is not failed</h2>
  <div class="prose"><p><strong>Refused</strong> means the call never reached the tool — no permission, or a person said no. <strong>Failed</strong> means it ran and errored, and may work next time. A tool refused twice in one task stops being offered. The count is derived from the transcript, so a resumed run withholds what the first one did.</p></div>

  <h2 class="section-title" id="fence">The filesystem fence</h2>
  <div class="prose"><p>Filesystem tools are confined to one root — the current thread's folder — resolving symlinks before the check. Reaching outside is <strong>refused</strong>, not sent for approval. The top of the disk and the home directory itself can never be chosen as a root.</p></div>

  ${callout("warning","Secrets are resolved inside the tool at the moment of the call, through <code>SecretResolver</code> — never baked in at construction, never in a prompt, log, observation or transcript.")}

  <div class="page-label">07 · Core concepts</div>
  <h1 class="page-title">Several employees, one goal</h1>
  <p class="page-desc">A plan can hand work to several employees. How results move between them — and how the manager decides to believe them — is structure, not a rule anyone has to remember.</p>
  <hr class="page-divider" />

  <h2 class="section-title" id="parallel">Independent tasks run at once</h2>
  <div class="prose"><p>Tasks whose dependencies are met form a <strong>wave</strong>; the supervisor starts a wave together, up to <code>MAX_PARALLEL_TASKS</code>. A failure ends the plan but not the wave — its neighbours never depended on it, and their results stand. Each wave logs its width as <code>prometheus.wave</code>.</p></div>
  ${code("text","",`plan:  survey ──┐
                 ├──►  write-report
       numbers ──┘

wave 1: survey, numbers    (in parallel)
wave 2: write-report       (receives both results)`)}

  <h2 class="section-title" id="edges">Context passes along declared edges</h2>
  <div class="prose"><p>A task receives its <em>direct</em> dependencies' results plus the baseline the manager chose for the objective — nothing else. There is no channel between employees; the coordinator in ${src("application/workforce/coordinator.py")} is the only route a result takes.</p></div>
  ${why("Carrying every finished result into every later task is sharing by default with extra steps. Declared edges make what one employee learns reach another only when the plan says it should.")}

  <h2 class="section-title" id="evidence">Accepted on the evidence</h2>
  <div class="prose"><p>A task that reached for tools and had every one refused or fail is <strong>not accepted</strong>, whatever its summary says. A task that used no tools is never faulted — judgement is real work. Acceptance never judges quality; that is the verifier's question. A refusal reassigns; a failure replans.</p></div>

  <h2 class="section-title" id="contradictions">Contradictions are resolved or escalated</h2>
  <div class="prose"><p>When two or more reports succeeded, the manager compares them before writing the answer. It settles what the evidence settles and hands the rest to you with both sides named — never blended into one confident sentence. An unreadable reconciliation answer means <em>consistent</em>: a check that escalates whenever its model stutters teaches you to ignore it.</p></div>

  <div class="page-label">08 · Context</div>
  <h1 class="page-title">Memory</h1>
  <p class="page-desc">What a task learned, what a plan produced and how you like things done are recalled into the context the next run starts from — within limits you can see and change.</p>
  <hr class="page-divider" />

  <h2 class="section-title" id="what">One contract</h2>
  <div class="prose"><p><code>Memory</code> is <code>remember</code> and <code>recall</code>, and every search goes through <code>recall</code>. Forgetting is a second contract, <code>MemoryMaintenance</code>, so holding <code>recall</code> does not grant the power to delete. A test fails the build if anything above the adapter names the index.</p></div>

  <h2 class="section-title" id="written">What is written</h2>

  <div class="prose"><p>The manager recalls <strong>once per objective</strong>, before reading the request, and hands that to the reading, the plan and every task — so "do the same for the returns folder" means something.</p></div>

  <h2 class="section-title" id="ranking">Relevance, importance, decay</h2>
  <div class="prose"><p>The index narrows; the domain decides. A search score is relevance × importance × decay, with a half-life and a time-to-live per kind: a working note is worth little by tomorrow, an outcome fades over months, a stated preference stays until you change it. When enough old episodes accumulate, a summariser folds them into one.</p></div>

  <div class="prose"><p>A tool may declare itself riskier than its effect, never safer. <code>reversible = False</code> raises the floor to HIGH. A tool that can tell calls apart assesses each one: a new file is LOW, an overwrite is HIGH.</p></div>

  <h2 class="section-title" id="threshold">The threshold</h2>
  <div class="prose"><p>At <strong>HIGH</strong> and above, a person decides — for every employee, and no declaration removes it. The policy engine is a pure function of the request and the catalog: no clock, no settings, no database. The same action decided twice decides the same way, which is what makes an audit line worth reading.</p></div>
  ${callout("warning","Policies never live in prompts. \"Never send email\" in a system prompt is a suggestion a model weighs; <code>no_sending</code> is a value a test asserts on.")}

  <h2 class="section-title" id="policies">Named policies</h2>
  <div class="prose"><p>An employee opts into policies with <code>policies:</code>, and they can only <strong>narrow</strong>. Rules resolve by severity — <code>DENY</code> &gt; <code>REQUIRE_APPROVAL</code> &gt; <code>ALLOW</code> — never by order. A denial is not a question: nobody is offered the chance to allow one call of it. A policy name nothing answers to is an error at load, so a typo can't read as a restriction in force.</p></div>

  <h2 class="section-title" id="catalog">Policy catalog</h2>
  <table class="api-table"><thead><tr><th>Policy</th><th>Decision</th><th>Meaning</th></tr></thead><tbody>
    <tr><td><code>no_irreversible_actions</code></td><td>Ask</td><td>Anything that cannot be undone waits for the user.</td></tr>
    <tr><td><code>approve_every_write</code></td><td>Ask</td><td>Even a reversible change waits for the user.</td></tr>
    <tr><td><code>read_only</code></td><td>Deny</td><td>May observe the world and change nothing in it.</td></tr>
    <tr><td><code>no_spending</code></td><td>Deny</td><td>May not move money.</td></tr>
    <tr><td><code>no_deleting</code></td><td>Deny</td><td>May not destroy anything.</td></tr>
    <tr><td><code>no_sending</code></td><td>Deny</td><td>Nothing addressed to a person leaves the machine.</td></tr>
    <tr><td><code>no_publishing</code></td><td>Deny</td><td>Nothing becomes visible to people who were not asked.</td></tr>
  </tbody></table>
  ${code("bash","",`uv run prometheus policies`)}

  <h2 class="section-title" id="asking">Who gets asked</h2>
  <div class="prose"><p>Whether to ask and who to ask are separate. The terminal reads stdin; the local interface parks the tool call until someone clicks; Telegram reaches someone who isn't at the keyboard. While parked, the task is <code>WAITING_FOR_APPROVAL</code>.</p></div>
  ${code("bash","",`uv run prometheus approvals          # what is waiting
uv run prometheus approve <id>
uv run prometheus reject <id>`)}
  ${callout("info","Anything but an explicit yes is a no — including a timeout, a closed page and no approver being reachable at all.")}

  <h2 class="section-title" id="scope">Scoped permissions</h2>
  <div class="prose"><p>An approval can release only this call, cover the same exact employee, action and resource for this task, or create an expiring persistent rule. Paths, domains, recipients and call limits are matched by the runtime, never by the window. A permission for one path or domain cannot be used for another, and a declared denial is checked before every lease.</p><p>The approval card shows the exact scope and an effect preview; file overwrites include a bounded diff. <strong>Settings → Permissions</strong> lists every active task and persistent lease with its limits and expiry, and revokes it immediately.</p></div>

  <h2 class="section-title" id="expire">Questions expire</h2>
  ${code("bash",".env",`PROMETHEUS_APPROVAL_MODE=prompt
PROMETHEUS_APPROVAL_TTL_SECONDS=900
PROMETHEUS_SECRET_TELEGRAM_BOT_TOKEN=...
PROMETHEUS_SECRET_TELEGRAM_CHAT_ID=...`)}
  <div class="prose"><p>An overdue approval is closed <em>in the store</em>, because the process that asked is usually gone by then. A terminal prompt is never timed out — somebody is standing there.</p></div>

  <h2 class="section-title" id="quiz">Quick check</h2>
  ${quiz("An employee declares <code>read_only</code> and tries <code>fs.write</code>. What happens?",
    ["It waits for approval", "It is denied, and nobody is offered to allow it", "It succeeds because WRITE is only medium risk", "The policy is ignored because it's not in the prompt"], 1,
    "Risk alone can only produce \"ask\". A declared policy can produce \"no\", and DENY outranks every other decision.")}
  ${pageNav("Workspaces & folders","Verification")}
`;

  <div class="page-label">12 · Trust &amp; control</div>
  <h1 class="page-title">Verification</h1>
  <p class="page-desc">An answer that says it wrote a file is not evidence that a file was written. Prometheus checks the record.</p>
  <hr class="page-divider" />

  <h2 class="section-title" id="why">Why reports are not enough</h2>
  <div class="prose"><p>A model's closing message is written to sound finished. Three consecutive runs of one request were once answered out of memory of the previous run: the document had been written the day before, the file had been deleted before the run started, and every criterion read as met.</p></div>

  <h2 class="section-title" id="record">The record outranks the report</h2>
  <div class="prose"><p>Verification happens at two levels — each task inside the employee runtime, and the whole objective in the manager — and both verifiers are shown what the platform <strong>recorded</strong>: which tools ran, what they returned, which files were written. A direct answer's record is that there is none, and it says so.</p></div>
  ${code("text","",`criteria (written first)   ─┐
report   (what came back)  ─┼──►  verifier  ──►  accept  |  replan once  |  escalate
record   (what actually ran)┘`)}

  <h2 class="section-title" id="replan">Replan once, then say so</h2>
  <div class="prose"><p>A rejected verdict sends the work back told what was missing. A second rejection is escalated: you get what did succeed plus a plain list of what did not. A shortfall is stated, never smoothed over.</p></div>

  <h2 class="section-title" id="floor">Never the cheapest judge</h2>
  <div class="prose"><p>Verification declares a minimum model quality as a <em>requirement</em>, not a hint. Hints only rank what survives the filter and the configured default beats them, so a default pointing at the cheapest model would keep winning the work it had just been shown unfit for. The trace then says <code>default 'local-fast' cannot do this work</code>.</p></div>
  ${callout("tip","JSON forms in verification prompts are empty shapes to fill, never examples — a cheap model once answered by copying the example verbatim.")}

  <h2 class="section-title" id="quiz">Quick check</h2>
  ${quiz("An employee reports \"summary.md written\" but no <code>fs.write</code> ran. What does the verifier see?",
    ["Only the report, so it passes", "The report next to a record showing no write happened", "Nothing — verification is skipped for files", "The file contents from the previous run"], 1,
    "The verifier is given the record alongside the report. An answer describing a file nobody wrote does not pass.")}
  ${pageNav("Approvals & policies","Audit & the brake")}
`;

  <div class="page-label">14 · Automation</div>
  <h1 class="page-title">Workflows</h1>
  <p class="page-desc">A process you already know the shape of is a YAML file. It runs through the same employees, the same gate and the same brake as anything the manager plans.</p>
  <hr class="page-divider" />

  <h2 class="section-title" id="what">A process is a file</h2>
  <div class="prose"><p>Files live under ${src("workflows/")}. The engine decides nothing about how work is done: it resolves the declared dependency graph and hands each step to the same execution contract the manager uses. A workflow and a plan differ in where the decomposition came from, and in nothing below it.</p></div>

  <h2 class="section-title" id="example">An example</h2>
  ${code("yaml","workflows/weekly-report.yaml",`name: weekly-report
description: >
  Collect what changed this week in one folder, work out the numbers,
  and leave a short report next to the data.

trigger: MANUAL

inputs:
  folder: "."
  report: weekly-report.md

steps:
  - name: survey
    employee: organizer
    instruction: >
      List everything under {folder} and say what kinds of file are there.

  - name: numbers
    employee: analyst
    depends_on: [survey]
    instruction: >
      Here is what the folder contains: {steps.survey}
      Compute the totals that these files actually support.
    max_attempts: 2         # reading and computing is free to repeat

  - name: write_up
    employee: researcher
    depends_on: [numbers]
    instruction: >

  ${code("yaml","validation/scenarios/sort-a-folder.yaml",`name: sort-a-folder
description: Five loose files put into folders by what they are.
phase: 4
tags: [files, employee]
employee: organizer

request: >
  Every file in "unsorted/" belongs in a folder. Move each under
  "sorted/<category>/" and write "sorted/INDEX.md".

reset: [sorted]
approve: [fs.move, fs.write]

setup:
  unsorted/invoice-4417.txt: |
    INVOICE 4417 ...`)}
  <div class="prose"><p>A scenario states what is asked, what the machine must have for the request to mean anything, and what would count as done. Expectations are checked against the <strong>store</strong>, never against the summary — including what must <em>not</em> have happened, like something sent nobody approved. The harness holds the same three doors a person uses — <code>ask-prometheus</code>, <code>run-task</code>, <code>run-workflow</code> — and no fourth.</p></div>

  <h2 class="section-title" id="run">Running scenarios</h2>
  ${code("bash","",`uv run prometheus scenarios
uv run prometheus validate sort-a-folder
uv run prometheus validate --tag files
uv run prometheus validate --regression`)}
  <div class="prose"><p>Failures are classified by type: <code>PLANNING</code>, <code>COMPUTER_USE</code>, <code>TOOL</code>, <code>MEMORY</code>, <code>MODEL</code>, <code>MISSING_CAPABILITY</code>, <code>NEEDED_APPROVAL</code>, <code>BUDGET</code>, <code>EXPECTATION</code>, <code>ENVIRONMENT</code>.</p></div>

  <h2 class="section-title" id="report">The report</h2>
  ${code("bash","",`uv run prometheus validation-report --write validation/REPORT.md`)}
  ${callout("info","One success is not reliability. A scenario that has passed once reads as SOMETIMES, and the regression set is derived from what has actually passed here — never from a hand-kept list.")}
  ${pageNav("Architecture","Development & contributing")}
`;

  PAGES["contributing"] = `
  <div class="page-label">25 · Reference</div>
  <h1 class="page-title">Development &amp; contributing</h1>
  <p class="page-desc">Four Python checks, one frontend job, and a handful of conventions that keep the codebase readable.</p>
  <hr class="page-divider" />

  <h2 class="section-title" id="checks">The checks CI runs</h2>
  ${code("bash","",`uv run pytest                                   # whole suite: no network, no key
uv run ruff check .
uv run lint-imports                             # architecture contracts
uv run python scripts/check_english_only.py
cd desktop && npm test                          # type-check, bundle, frontend tests`)}
  ${code("bash","",`uv run pytest tests/unit/test_executor.py::test_name     # a single test`)}

  <h2 class="section-title" id="conventions">Conventions</h2>
  <div class="prose"><ul>
    <li><strong>English-only codebase</strong> — identifiers, comments, logs, schema, prompts and docs. Runtime data may be any language.</li>
    <li><strong>Tests never need a network or a key.</strong> Fakes in <code>tests/fakes/</code> carry the suite; integration tests use a real SQLite file on <code>tmp_path</code>.</li>
    <li><strong>Comments explain why, not what</strong> — each non-obvious decision states the alternative it rejected.</li>
    <li><strong>Every entity carries a <code>workspace_id</code>.</strong></li>
    <li><strong>A significant departure gets an ADR</strong> in <code>docs/adr/</code>.</li>
    <li><strong>A phase closes only when its capability has done real work</strong>, recorded in <code>validation/tasks/</code>.</li>
  </ul></div>

  <h2 class="section-title" id="prompts">Prompts</h2>
  <div class="prose"><p>Prompts are files in <code>prompts/&lt;name&gt;/&lt;version&gt;.md</code>, not embedded strings. A new version sits beside the old one. A JSON form in a prompt is a shape to fill, never an example to copy — <code>tests/unit/test_prompt_forms.py</code> enforces it.</p></div>

  <h2 class="section-title" id="migrations">Migrations</h2>
  ${code("bash","",`uv run alembic revision -m "add something"   # nnn_slug naming
uv run alembic upgrade head`)}
  <div class="prose"><p>SQL is written natively for SQLite; portability is the job of the domain protocols and the dialect module.</p></div>

  <h2 class="section-title" id="issues">Reporting a problem</h2>
  <div class="prose"><p>Found a request it handled badly? Open an issue at <a href="https://github.com/AethraIntelligence/Prometheus/issues" target="_blank" rel="noopener">github.com/AethraIntelligence/Prometheus/issues</a> with the request you typed and what came back — that is exactly what a validation scenario is made from.</p></div>
  ${callout("tip","Prometheus is MIT-licensed. © 2026 Denys Zhodik.")}
  ${pageNav("Validation",null)}
`;

  function comingSoon(id){
    return '<div class="page-label">'+LABELS[id]+'</div>'
      + '<h1 class="page-title">'+LABELS[id]+'</h1>'
      + '<div class="coming-soon"><div class="coming-soon-icon">\uD83D\uDEA7</div>'
      + '<div class="coming-soon-title">Page not found</div>'
      + '<p style="font-size:14px">Use the sidebar to navigate to a chapter.</p></div>';
  }

  let activePage = "intro";

  function renderSidebar(){
    let html = "";
    NAV.forEach(function(section){
      html += '<div class="sidebar-group-label">'+section.group+'</div>';
      section.items.forEach(function(item){
        const cls = "sidebar-link" + (activePage===item.id?" active":"");
        html += '<button class="'+cls+'" onclick="go(\''+item.id+'\')"><span class="sidebar-num">'+item.num+'</span><span>'+item.label+'</span></button>';
      });
      html += '<hr class="sidebar-hr" />';
    });
    document.getElementById("sidebar").innerHTML = html;
  }

  function renderTOC(){
    const toc = TOC[activePage];
    const el = document.getElementById("toc");
    if(!toc){ el.innerHTML = ""; el.style.display = "none"; return; }
    el.style.display = "";
    let html = '<div class="toc-title">On this page</div>';
    toc.forEach(function(pair){
      html += '<a class="toc-link" data-target="'+pair[0]+'" onclick="scrollTo2(\''+pair[0]+'\')">'+pair[1]+'</a>';
    });
    el.innerHTML = html;
  }

  function renderPage(){
    document.getElementById("content").innerHTML = PAGES[activePage] || comingSoon(activePage);
    window.scrollTo(0,0);
    setupScrollSpy();
  }

  function go(id){
    if(!PAGES[id]) id = "intro";
    activePage = id;
    if(location.hash.slice(1) !== id) history.replaceState(null, "", id === "intro" ? location.pathname : "#"+id);
    renderSidebar();
    renderPage();
    renderTOC();
    closeSidebar();
  }

  function scrollTo2(id){
    const el = document.getElementById(id);
    if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
  }

  function copyCode(btn){
    const pre = btn.closest(".code-block").querySelector("pre");
    if(navigator.clipboard){
      navigator.clipboard.writeText(pre.textContent).then(function(){
        btn.textContent = "Copied!";
        btn.classList.add("copied");
        setTimeout(function(){ btn.textContent="Copy"; btn.classList.remove("copied"); },2000);
      });
    }
  }

  function answer(quizId, picked, correct){
    const box = document.getElementById(quizId);
    const opts = box.querySelectorAll(".quiz-opt");
    opts.forEach(function(o,i){
      o.classList.remove("correct","wrong");
      if(i===correct) o.classList.add("correct");
      if(i===picked && i!==correct) o.classList.add("wrong");
    });
    box.querySelector(".quiz-explain").classList.add("show");
  }

  function toggleSidebar(){
    document.getElementById("sidebar").classList.toggle("mobile-open");
    document.getElementById("overlay").classList.toggle("visible");
    document.getElementById("mobBtn").classList.toggle("open");
  }
  function closeSidebar(){
    document.getElementById("sidebar").classList.remove("mobile-open");
    document.getElementById("overlay").classList.remove("visible");
    document.getElementById("mobBtn").classList.remove("open");
  }

  function onSearch(val){
    const v = val.trim().toLowerCase();
    document.querySelectorAll(".sidebar-link").forEach(function(link){
      const txt = link.textContent.toLowerCase();
      link.style.display = (!v || txt.indexOf(v)>=0) ? "" : "none";
    });
  }

  let spyObserver = null;
  function setupScrollSpy(){
    if(spyObserver) spyObserver.disconnect();
    const headings = document.querySelectorAll("#content h2[id]");
    if(!headings.length) return;
    spyObserver = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){
          document.querySelectorAll(".toc-link").forEach(function(l){
            l.classList.toggle("active", l.dataset.target===e.target.id);
          });
        }
      });
    }, { rootMargin:"-20% 0% -70% 0%" });
    headings.forEach(function(h){ spyObserver.observe(h); });
  }

  window.addEventListener("hashchange", function(){ const id = location.hash.slice(1); if(id && id !== activePage) go(id); });
  go(location.hash.slice(1) || "intro");
  </script>
</body>
</html>
