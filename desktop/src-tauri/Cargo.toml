[package]
name = "prometheus-desktop"
version = "0.1.0"
description = "The Prometheus desktop shell"
repository = "https://github.com/AethraIntelligence/Prometheus"
license = "MIT"
authors = ["Denys Zhodik"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The window's HTTP goes through Rust rather than the webview's own network
# stack: on macOS a page served from tauri://localhost cannot reach
# http://127.0.0.1 at all, and fails before the request leaves the process.
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
# Opens a link in the system browser - where to get a plugin's token. The
# webview itself navigates nowhere but its own page.
tauri-plugin-opener = "2"
# Phase 13. A second launch focuses the window that is already open instead of
# starting a second shell - and with it a second runtime on the same data.
tauri-plugin-single-instance = "2"
# Signed updates: the package is verified against the public key compiled into
# the build before it replaces anything. Registered only when a key was given.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
