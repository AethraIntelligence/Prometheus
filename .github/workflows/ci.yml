name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Architecture boundaries
        run: uv run lint-imports

      - name: English-only codebase
        run: uv run python scripts/check_english_only.py

      # No provider keys are configured: the suite must be green without one.
      - name: Tests
        run: uv run pytest

      - name: Validation release contract
        run: uv run prometheus validation-gate --check-config

  # The window, checked without building it. `npm test` needs no runtime and no
  # Rust toolchain: it renders the interface against a scripted one, and it
  # fails on a broken Feature-Sliced layer boundary the same way `lint-imports`
  # fails on a broken Python one.
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Types and bundle
        run: npm run build

      - name: Tests
        run: npm test
