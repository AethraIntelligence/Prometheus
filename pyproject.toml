[project]
name = "prometheus"
version = "0.1.0"
description = "Prometheus - a local-first platform where an AI manager runs digital employees on your machine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Denys Zhodik" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "structlog>=24.4",
    "typer>=0.15",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    # The local interface. Not an extra, unlike the browser and the desktop:
    # from Phase 6 on it is how the platform is used, and a surface that half
    # the installations cannot open is not the primary surface.
    "fastapi>=0.115",
    "uvicorn>=0.32",
    # Credentials are encrypted where they are stored (Phase 17). Not an extra:
    # a key the user typed into the settings window is the ordinary case, and a
    # platform that stores it in the clear on half its installations has not
    # made a choice, it has made a default. Portable wheels on macOS, Linux and
    # Windows, and nothing from the operating system's own keychain - the
    # backend has to run on a server too.
    "cryptography>=44.0",
    # Everything below used to be an extra, and every extra was a step a person
    # who had just cloned the repository did not know to take: a document that
    # silently would not add, an employee that failed on its first web page.
    # One `uv sync` installs the whole platform. What each one can do is still
    # decided at run time - the desktop driver moves nothing unless
    # PROMETHEUS_FLAGS__COMPUTER_USE is on and an application is allowed.
    "playwright>=1.48",  # the browser tools; the engine itself is fetched on first start
    "pypdf>=5.1",  # reading a PDF
    "markdown-it-py>=3.0",  # writing one: Markdown to the page Chromium prints
    "asyncpg>=0.30",  # the PostgreSQL backend (ADR 0017)
    "pyautogui>=0.9.54",  # the desktop surface, off by a flag
]

[project.urls]
Homepage = "https://github.com/ysz7/Prometheus"
Repository = "https://github.com/ysz7/Prometheus.git"
Issues = "https://github.com/ysz7/Prometheus/issues"

[project.scripts]
prometheus = "app.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "domain", "application", "infrastructure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.importlinter]
root_packages = ["app", "application", "domain", "infrastructure"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture: app -> application -> domain; infrastructure -> domain"
type = "layers"
layers = ["app", "application | infrastructure", "domain"]

[[tool.importlinter.contracts]]
name = "domain depends on nothing but the standard library and pydantic"
type = "forbidden"
source_modules = ["domain"]
forbidden_modules = [
    "app",
    "application",
    "infrastructure",
    "sqlalchemy",
    "alembic",
    "httpx",
    "openai",
    "anthropic",
    "playwright",
    "typer",
    "structlog",
]

[[tool.importlinter.contracts]]
name = "Prometheus knows the workforce contracts only, never infrastructure or a concrete employee"
type = "forbidden"
source_modules = ["application.prometheus"]
forbidden_modules = ["infrastructure", "app", "employees"]

# §9.10. The layering contract above already forbids this; it is named on its own
# because the rule it protects is specific: FTS5 is the one SQLite-specific thing
# in the schema, and a search written into `application/` would make replacing it
# a change to half the codebase rather than to one adapter. The companion test is
# tests/unit/test_memory_access_rule.py, which checks the strings as well.
[[tool.importlinter.contracts]]
name = "Memory is reached through its contract, never through the adapter"
type = "forbidden"
source_modules = ["application", "domain"]
forbidden_modules = ["infrastructure.memory", "infrastructure.persistence"]
