id: gmail
name: Gmail
description: Search, read and draft email; sending asks first
about: Employees can find and read your mail, threads and attachments and prepare drafts. Sending a message,
  changing labels or filters asks you every time. Signs in with Google in your browser; access stays on
  this machine and passes through no third-party service.
category: Productivity
publisher: taylorwilsdon (workspace-mcp)
homepage: https://github.com/taylorwilsdon/google_workspace_mcp
popular: true
runtime: PYTHON
command: uvx
args:
- 'workspace-mcp@1.26.2'
- --single-user
- --tools
- gmail
- --tool-tier
- extended
env:
  WORKSPACE_MCP_CREDENTIALS_DIR: ~/.google_workspace_mcp/prometheus-gmail
setup:
- text: Open Google Cloud Console and create
    a project (any name).
  url: https://console.cloud.google.com/projectcreate
- text: Enable the Gmail API for that project. Gmail and Google Drive can use the same project.
  url: https://console.cloud.google.com/apis/library/gmail.googleapis.com
- text: 'In Google Auth Platform: under Branding enter an app name and your email; under Audience choose
    External and press Publish app so the status is In production. In Testing, Google signs you out every
    7 days.'
  url: https://console.cloud.google.com/auth/overview
- text: Under Clients create a client of type Desktop app and copy its Client ID and Client secret into
    the fields below.
  url: https://console.cloud.google.com/auth/clients
- 'When signing in, Google shows ''Google hasn''t verified this app'' for a client nobody verified. Choose
  Advanced, then continue: it is your own client.'
settings:
- key: GOOGLE_OAUTH_CLIENT_ID
  label: OAuth client ID
  kind: SECRET
  required: true
  placeholder: 1234-abcd.apps.googleusercontent.com
  help: From a Desktop app client. Gmail and Google Drive can share one.
  help_url: https://console.cloud.google.com/auth/clients
- key: GOOGLE_OAUTH_CLIENT_SECRET
  label: OAuth client secret
  kind: SECRET
  required: true
  placeholder: GOCSPX-...
- key: USER_GOOGLE_EMAIL
  label: Your Google address
  kind: TEXT
  required: true
  placeholder: you@gmail.com
  help: The account employees work in.
capabilities:
- EMAIL
effects:
  READ:
  - search_gmail_messages
  - get_gmail_message_content
  - get_gmail_messages_content_batch
  - get_gmail_attachment_content
  - get_gmail_thread_content
  - list_gmail_labels
  - list_gmail_filters
  WRITE:
  - draft_gmail_message
  SEND:
  - send_gmail_message
sign_in:
  label: Sign in with Google
  tool: search_gmail_messages
  arguments:
    query: in:inbox
    page_size: 1
  help: A Google page opens in your browser. If it says the app is not verified, choose Advanced and continue.
    Allow access, come back and press Check.
icon:
  color: '#EA4335'
  background: '#FFFFFF'
